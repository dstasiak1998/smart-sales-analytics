[project]
name = "smart-sales-analytics"
version = "0.1.0"
description = "End-to-end sales analytics platform — portfolio project"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.15.0",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.3",
    "sqlalchemy>=2.0.49",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
